<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Hierarchy Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* SVG Container */
        .svg-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 95%;
        }

        /* SVG Animation Classes */
        .component {
            transition: fill 0.3s, stroke-width 0.3s;
            cursor: pointer;
        }
        
        .active-scan {
            fill: #ffeb3b !important; /* Yellow flash for searching */
            stroke: #f57f17;
            stroke-width: 3;
        }

        .active-found {
            fill: #69f0ae !important; /* Green flash for found */
            stroke: #2e7d32;
            stroke-width: 3;
        }

        .data-packet {
            opacity: 0; /* Hidden by default */
        }

        .text-label {
            font-family: monospace;
            pointer-events: none;
        }

        .info-panel {
            margin-top: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-left: 5px solid #2196f3;
            width: 100%;
            max-width: 600px;
            text-align: center;
            font-weight: bold;
            color: #0d47a1;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h1>Hierarchical Memory System</h1>
    
    <div class="controls">
        <button id="btn-cache-hit" onclick="simulateAccess('cache')">Simulate Cache Hit (Fast)</button>
        <button id="btn-ram-hit" onclick="simulateAccess('ram')">Simulate RAM Access (Medium)</button>
        <button id="btn-disk-hit" onclick="simulateAccess('disk')">Simulate Disk Access (Slow)</button>
    </div>

    <div class="info-panel" id="status-text">System Ready. Select an operation.</div>

    <div class="svg-container">
        <svg viewBox="0 0 600 450" width="100%" height="auto" id="memory-svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
                </marker>
            </defs>

            <line x1="50" y1="50" x2="50" y2="380" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
            <text x="40" y="40" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 40,40)">Cost & Speed Increases</text>
            
            <line x1="550" y1="380" x2="550" y2="50" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
            <text x="560" y="200" text-anchor="middle" font-size="12" fill="#555" transform="rotate(90 560,200)">Capacity Increases</text>

            <g id="cpu-group">
                <rect x="250" y="10" width="100" height="40" rx="5" fill="#ef5350" stroke="#b71c1c" stroke-width="2" />
                <text x="300" y="35" text-anchor="middle" fill="white" font-weight="bold">CPU Core</text>
            </g>

            <g id="lvl-regs">
                <polygon points="260,60 340,60 350,90 250,90" fill="#ffab91" stroke="#d84315" stroke-width="1" class="component" id="comp-regs"/>
                <text x="300" y="80" text-anchor="middle" font-size="12" class="text-label">Registers</text>
            </g>

            <g id="lvl-cache">
                <polygon points="230,100 370,100 390,150 210,150" fill="#ffe082" stroke="#ff8f00" stroke-width="1" class="component" id="comp-cache"/>
                <text x="300" y="130" text-anchor="middle" font-size="12" class="text-label">Cache (SRAM)</text>
            </g>

            <g id="lvl-ram">
                <polygon points="190,160 410,160 440,240 160,240" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1" class="component" id="comp-ram"/>
                <text x="300" y="205" text-anchor="middle" font-size="14" class="text-label">Main Memory (RAM)</text>
            </g>

            <g id="lvl-disk">
                <polygon points="140,250 460,250 500,380 100,380" fill="#90caf9" stroke="#1565c0" stroke-width="1" class="component" id="comp-disk"/>
                <text x="300" y="320" text-anchor="middle" font-size="16" class="text-label">Secondary Storage (SSD/HDD)</text>
            </g>

            <circle id="data-packet" cx="300" cy="350" r="8" fill="#6200ea" stroke="white" stroke-width="2" class="data-packet"/>

            <line x1="300" y1="50" x2="300" y2="60" stroke="#333" stroke-width="2" stroke-dasharray="4"/>
            <line x1="300" y1="90" x2="300" y2="100" stroke="#333" stroke-width="2" stroke-dasharray="4"/>
            <line x1="300" y1="150" x2="300" y2="160" stroke="#333" stroke-width="2" stroke-dasharray="4"/>
            <line x1="300" y1="240" x2="300" y2="250" stroke="#333" stroke-width="2" stroke-dasharray="4"/>

        </svg>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const packet = document.getElementById('data-packet');
        const comps = {
            regs: document.getElementById('comp-regs'),
            cache: document.getElementById('comp-cache'),
            ram: document.getElementById('comp-ram'),
            disk: document.getElementById('comp-disk')
        };

        // Helper to reset styles
        function resetStyles() {
            for (let key in comps) {
                comps[key].classList.remove('active-scan', 'active-found');
            }
            packet.style.opacity = 0;
            packet.style.transition = 'none';
        }

        // Helper for delay
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function simulateAccess(type) {
            // Disable buttons
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            resetStyles();

            // 1. CPU Requests Data
            statusText.innerText = "CPU requests data address...";
            await delay(800);

            // 2. Check Registers
            statusText.innerText = "Checking Registers...";
            comps.regs.classList.add('active-scan');
            await delay(500);
            comps.regs.classList.remove('active-scan');

            if (type === 'regs') {
                finalize('regs', "Data found in Registers! (Instant)");
                return;
            }

            // 3. Check Cache
            statusText.innerText = "Registers Miss. Checking Cache (L1/L2)...";
            comps.cache.classList.add('active-scan');
            await delay(800);
            
            if (type === 'cache') {
                comps.cache.classList.remove('active-scan');
                comps.cache.classList.add('active-found');
                statusText.innerText = "Cache Hit! Moving data to CPU.";
                await moveData(125, 25);
                finalize();
                return;
            }
            comps.cache.classList.remove('active-scan');

            // 4. Check RAM
            statusText.innerText = "Cache Miss. Checking Main Memory (RAM)...";
            comps.ram.classList.add('active-scan');
            await delay(1200);

            if (type === 'ram') {
                comps.ram.classList.remove('active-scan');
                comps.ram.classList.add('active-found');
                statusText.innerText = "RAM Hit! Loading Line to Cache -> CPU.";
                await moveData(200, 25);
                finalize();
                return;
            }
            comps.ram.classList.remove('active-scan');

            // 5. Check Disk
            statusText.innerText = "RAM Miss (Page Fault). Accessing Disk Storage...";
            comps.disk.classList.add('active-scan');
            await delay(2000); // Disk is slow!
            
            comps.disk.classList.remove('active-scan');
            comps.disk.classList.add('active-found');
            statusText.innerText = "Data found on Disk. Swapping to RAM -> Cache -> CPU.";
            await moveData(315, 25);
            finalize();
        }

        async function moveData(startY, endY) {
            packet.setAttribute('cy', startY);
            packet.style.opacity = 1;
            packet.style.transition = 'cy 1.5s ease-out'; // Animation speed
            
            // Trigger reflow
            packet.getBoundingClientRect();
            
            packet.setAttribute('cy', endY);
            await delay(1500);
        }

        function finalize() {
            statusText.innerText += " Operation Complete.";
            document.querySelectorAll('button').forEach(b => b.disabled = false);
        }
    </script>
</body>
</html>
